<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Ambil Antrian</title>
        <link href="../bootstrap/css/bootstrap.css" rel="stylesheet">
        <link rel="icon" href="../src/img/favicon.png">
        <style>
        html {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: rgb(190, 190, 190)1;
            overflow: hidden;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #hiddenDiv, #hiddenDiv * {
                visibility: visible;
            }

            #hiddenDiv {
                position: absolute;
                left: 0;
                top: 0;
            }

            body {
                    size: 75mm 297mm; 
                    margin: 10px;
                    color: black;
                    background-color: white;
                }

                .print-header {
                    text-align: center;
                    font-size: 15px;
                    margin-bottom: 20px;
                    margin-top: 20px;

                }

                .print-header img {
                    max-width: 100%;
                    height: auto;
                }

                .print-content {
                    text-align: center;
                    font-size: 18px;
                }

                #nomorAntrianPrint {
                    font-size: 120px;
                }

                .print-button {
                    display: none;
                }
        }

        .numpad {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
        }

        #input {
            width: 100%;
            margin-bottom: 10px;
            padding: 5px;
            font-size: 16px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .button {
            padding: 20px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #f0f0f0;
        }
        </style>
    </head>
    <body>
    <nav class="navbar navbar-expand-lg" style="background-color: #0f838c;">
            <div class="container-fluid">
            <a class="navbar-brand" href="index.php">
                <img src="../src/img/inovnav.png" style="width: 200px;">
            </a>

            <div class="navbar-text">
                <span class="fs-4 text-white" id="tanggal"></span>
            </div>
            </div>
        </nav>

        <div class="container text-center w-50" style="height: 100vh;">
            <h2 class="text-center my-4">Cetak Nomor Antrian</h2>
            <form id="printForm">
                <div class="btn-group d-flex my-4" role="group" aria-label="Basic radio toggle button group">
                    <input type="radio" class="btn-check" name="antrianType" id="btncheck1" autocomplete="off" value="umum">
                    <label class="btn btn-outline-primary btn-block p-3" for="btncheck1">UMUM</label>
                    
                    <input type="radio" class="btn-check" name="antrianType" id="btncheck3" autocomplete="off" value="bpjs">
                    <label class="btn btn-outline-primary btn-block p-3" for="btncheck3">BPJS</label>
                </div>
                
                
                
                <div class="numpad">
                    <input type="text" id="input" readonly>
                    <div class="buttons">
                        <button class="button">1</button>
                        <button class="button">2</button>
                        <button class="button">3</button>
                        <button class="button">4</button>
                        <button class="button">5</button>
                        <button class="button">6</button>
                        <button class="button">7</button>
                        <button class="button">8</button>
                        <button class="button">9</button>
                        <button class="button">Clear</button>
                        <button class="button">0</button>
                        <button class="button" type="button" value="Cetak">Cetak</button>
                    </div>
                </div>
            </form>
        </div>




        <div id="hiddenDiv" style="visibility: hidden;">
        <div class="print-container">
            <div class="print-header">
                <img src="../src/img/inovcetak.jpg" alt="" style="width: 500px;">
                <br> 
                Jl. Merdeka 72A Kota Blitar
                <hr>
            </div>
            <div class="print-content">
                Nomor Antrian Anda
            </div>
            <div class="print-content" style="font-size: 36px;">
                <span id="nomorAntrianPrint">0</span>
            </div>
            <div class="print-header">
                Silahkan Menunggu Nomer Anda Dipanggil
            </div>
        </div>
        </div>

        <!-- Modal -->
        <div class="modal fade" id="antrianModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="antrianModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header text-center">
                        <h1 class="modal-title w-100" id="antrianModalLabel">CETAK ANTRIAN</h1>
                    </div>
                    <div class="modal-body text-center fs-2" id="nomorAntrianContainer">
                        <!-- Nomor Antrian dengan label akan ditambahkan di sini -->
                    </div>
                    <div class="modal-footer d-flex justify-content-between align-items-center">
                        <button type="button" class="btn btn-primary btn-lg" id="cetakButton">Cetak</button>
                        <button type="button" class="btn btn-secondary btn-lg" data-bs-dismiss="modal">Tutup</button>
                    </div>
                </div>
            </div>
        </div>


        <footer class=" fixed-bottom text-center p-2">
        <div class="container">
            <div class="copyright text-center mb-2 mb-md-0">
            &copy; 2024 - Rjuna. All rights reserved.
            </div>
        </div>
        </footer>



        


        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="../bootstrap/js/bootstrap.bundle.js"></script>

        <!-- TANGGAL -->
        <script>
            function updateTanggal() {
            var sekarang = new Date();
    
            var options = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: 'numeric', hour12: false };
            var formatter = new Intl.DateTimeFormat('id-ID', options);
            var tanggalString = formatter.format(sekarang);
    
            document.getElementById("tanggal").innerHTML = tanggalString;
            }
    
            
            // Update setiap detik
            setInterval(updateTanggal, 1000);
            
            updateTanggal();
        </script>
        
        <script>
            document.querySelectorAll('.button').forEach(button => {
                button.addEventListener('click', (event) => {
                    event.preventDefault(); // Menyimpan tombol dari perilaku default
                    const value = button.textContent;
                    const input = document.getElementById('input');
                    if (value === 'Clear') {
                        input.value = '';
                    } else if (value === 'Cetak') {
                        // Tambahkan kode yang sesuai untuk tombol "Cetak"
                    } else {
                        input.value += value;
                    }
                });
            });
        </script>

        <script>
            // Menambahkan event listener untuk tombol "Cetak" pada numpad
            document.querySelector('.button[value="Cetak"]').addEventListener('click', function() {
                const nomorAntrian = document.getElementById('input').value;
                const tipeAntrian = document.querySelector('input[name="antrianType"]:checked').value;

                let label;
                if (tipeAntrian === 'umum') {
                    label = 'A';
                } else if (tipeAntrian === 'bpjs') {
                    label = 'B';
                }

                const nomorAntrianWithLabel = "<h1  style='font-size: 100px'><b>" + label + " " + nomorAntrian + "</b></h1>";

                // Tampilkan nomor antrian dengan label pada modal
                document.getElementById('nomorAntrianContainer').innerHTML = nomorAntrianWithLabel;
                document.getElementById('nomorAntrianPrint').innerText = label + " " + nomorAntrian;

                // Buka modal
                $('#antrianModal').modal('show');
            });
        </script>

        <script>
            document.getElementById('cetakButton').addEventListener('click', function() {
                window.print();
            });
        </script>

    </body>
</html>
